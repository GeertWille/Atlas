<script>
// A header-bidding library under a custom global name that is completely
// loaded, and has already run part of an auction, before anything could hook it.
(function () {
  var handlers = {};
  var fired = [];
  function emit(type, args) {
    fired.push({ eventType: type, args: args, elapsedTime: performance.now() });
    (handlers[type] || []).forEach(function (handler) { handler(args); });
  }
  var cyclic = { name: 'cyclic' };
  cyclic.self = cyclic;
  window._pbjsGlobals = ['acmeHb'];
  window.acmeHb = {
    version: 'v9.1.0',
    installedModules: ['fooBidAdapter', 42, 'barBidAdapter'],
    que: [],
    onEvent: function (type, handler) { (handlers[type] = handlers[type] || []).push(handler); },
    getEvents: function () { return fired.slice(); },
    setConfig: function (config) { window.debugRequested = config.debug; },
    getConfig: function () {
      return {
        debug: true,
        bidderTimeout: 1500,
        priceGranularity: { buckets: [{ max: 20, increment: 0.05 }] },
        currency: { adServerCurrency: 'EUR', bidderCurrencyDefault: { foo: 'USD' } },
        floors: { enforcement: { floorDeals: true }, data: { default: 0.5 } },
        userSync: { syncEnabled: false },
        consentManagement: { gdpr: { cmpApi: 'iab', timeout: 8000 } },
        s2sConfig: { bidders: ['foo'], onTimeout: function () {}, loop: cyclic },
        realTimeData: { dataProviders: [{ name: 'huge', blob: new Array(30001).join('x') }] },
      };
    },
    emit: emit,
  };
  emit('auctionInit', {
    auctionId: 'auction-1',
    timeout: 1500,
    adUnits: [
      {
        code: 'unit-a',
        mediaTypes: { banner: { sizes: [[300, 250], [336, 280]] } },
        bids: [
          { bidder: 'foo', params: { placementId: 12345, keywords: { section: ['news'] }, onEvent: function () {} } },
          { bidder: 'bar', params: { siteId: '9' } },
          { bidder: 'foo' },
        ],
      },
      // Params too large to carry are left out whole; the bidder is still listed.
      { code: 'unit-b', mediaTypes: { banner: { sizes: [728, 90] }, video: { playerSize: [640, 480] } }, bids: [{ bidder: 'bar', params: { blob: new Array(3000).join('x') } }] },
      { code: 'unit-c', sizes: [[160, 600]], bids: [{ module: 'pubCommonId' }] },
      // A "twin": the code of the first ad unit again, with other sizes and another bidder.
      { code: 'unit-a', mediaTypes: { banner: { sizes: [[970, 250], [300, 250]] } }, bids: [{ bidder: 'baz', params: { zone: 7 } }] },
    ],
  });
  emit('bidRequested', {
    bidderCode: 'foo',
    auctionId: 'auction-1',
    bidderRequestId: 'request-foo',
    bids: [{ bidder: 'foo', adUnitCode: 'unit-a', bidId: 'bid-1' }, { bidder: 'foo', adUnitCode: 'unit-a', bidId: 'bid-2' }, { bidder: 'foo', bidId: 'bid-without-unit' }],
    gdprConsent: { consentString: 'CPsecretTcString', gdprApplies: true, apiVersion: 2 },
    ortb2: {
      source: {
        ext: {
          schain: {
            ver: '1.0',
            complete: 1,
            nodes: [{ asi: 'exchange.example', sid: 'pub-1', hp: 1 }, { asi: '', sid: 'nameless' }, { asi: 'reseller.example', sid: 77, hp: 0 }],
          },
        },
      },
    },
  });
  // An older library: the supply chain sits on the bid, and consent came without a string.
  emit('bidRequested', {
    bidderCode: 'bar',
    auctionId: 'auction-1',
    bids: [{ adUnitCode: 'unit-a', schain: { nodes: [{ asi: 'legacy.example', sid: 's-2' }] } }, { adUnitCode: 'unit-b' }],
    gdprConsent: { gdprApplies: true },
  });
  emit('unrelatedEvent', { ignored: true });
})();
</script>
<script>
// A consent platform whose banner is still open; the reader answers it later.
(function () {
  var listeners = [];
  window.__tcfapi = function (command, version, callback) {
    if (command !== 'addEventListener') return;
    listeners.push(callback);
    callback({ eventStatus: 'cmpuishown', gdprApplies: true, tcString: '', purpose: { consents: {} }, vendor: { consents: {} } }, true);
  };
  window.tellConsentListeners = function (tcData, success) {
    listeners.forEach(function (listener) { listener(tcData, success); });
  };
  window.consentListenerCount = function () { return listeners.length; };
})();
</script>
<script>
// Amazon's bootstrap stub, a fetch through it, then the "real" library taking over.
(function () {
  function queue(command, args) { window.apstag._Q.push([command, args]); }
  window.apstag = {
    init: function () { queue('i', arguments); },
    fetchBids: function () { queue('f', arguments); },
    setDisplayBids: function () {},
    _Q: [],
  };
  window.apsCallbacks = 0;
  window.apstag.fetchBids({ slots: [{ slotID: 'unit-a' }, { slotID: 'unit-b' }], timeout: 900 }, function (bids) {
    window.apsCallbacks += 1;
    window.apsFirstBids = bids.length;
  });
  setTimeout(function () {
    function fetchBids(config, callback) {
      setTimeout(function () { callback([{ slotID: config.slots[0].slotID, amznbid: 'x' }]); }, 40);
    }
    var queued = window.apstag._Q;
    window.apstag.fetchBids = fetchBids;
    queued.forEach(function (call) { if (call[0] === 'f') fetchBids.apply(null, call[1]); });
    setTimeout(function () {
      window.apstag.fetchBids({ slots: [{ slotID: 'unit-c' }] }, function () { window.apsCallbacks += 1; });
    }, 120);
  }, 150);
})();
</script>

<body style="margin:0;height:5000px">
<div id="unit-a" style="width:300px;height:250px"></div>
<div id="unit-hidden" style="display:none"></div>
<div id="unit-b" style="position:absolute;top:3000px;width:728px;height:90px"></div>
<script>
// An ad server library assigned to the page in one piece, with a slot already
// defined, and later slots created through its factories.
(function () {
  var listeners = {};
  var slots = [];
  function size(width, height) {
    return { getWidth: function () { return width; }, getHeight: function () { return height; } };
  }
  function slot(path, sizes, elementId) {
    var targeting = {};
    var made = {
      getSlotElementId: function () { return elementId; },
      getAdUnitPath: function () { return path; },
      getSizes: function () { return sizes; },
      getTargetingKeys: function () { return Object.keys(targeting); },
      setTargeting: function (key, value) { targeting[key] = [value]; return made; },
    };
    slots.push(made);
    return made;
  }
  // A slot of a GPT release without the deprecated targeting getters.
  function modernSlot(path, elementId, targeting) {
    var made = slot(path, [], elementId);
    delete made.getTargetingKeys;
    made.getConfig = function (key) { return key === 'targeting' ? { targeting: targeting } : {}; };
    return made;
  }
  function fire(type, detail) {
    (listeners[type] || []).forEach(function (listener) { listener(detail); });
  }
  slot('/1/site/early', [size(300, 250), 'fluid'], 'unit-a');
  window.googletag = {
    apiReady: true,
    cmd: { push: function (command) { command(); } },
    getVersion: function () { return 20261101; },
    defineSlot: function (path, sizes, elementId) {
      // Like GPT: a container can have one slot.
      if (slots.some(function (existing) { return existing.getSlotElementId() === elementId; })) return null;
      return slot(path, sizes.map(function (s) { return size(s[0], s[1]); }), elementId);
    },
    destroySlots: function (doomed) {
      (doomed || slots.slice()).forEach(function (gone) { slots.splice(slots.indexOf(gone), 1); });
      return true;
    },
    defineOutOfPageSlot: function (path, elementId) {
      return modernSlot(path, elementId, { hb_adid: ['ad-9'], hb_cleared: null, hb_empty: [], section: 'news' });
    },
    pubads: function () {
      return {
        getSlots: function () { return slots.slice(); },
        addEventListener: function (type, listener) { (listeners[type] = listeners[type] || []).push(listener); },
      };
    },
  };
  window.defineSlotLooksNative = String(googletag.defineSlot).indexOf('return slot(path') >= 0;
  var below = googletag.defineSlot('/1/site/below', [[728, 90]], 'unit-b');
  var hidden = googletag.defineSlot('/1/site/hidden', [[1, 1]], 'unit-hidden');
  var missing = googletag.defineOutOfPageSlot('/1/site/interstitial', 'unit-missing');
  window.definedSlotsAreUntouched = below.getSlotElementId() === 'unit-b' && !!hidden && !!missing;

  setTimeout(function () {
    var early = slots[0];
    early.setTargeting('hb_bidder', 'foo').setTargeting('hb_pb', '1.50').setTargeting('section', 'news');
    fire('slotRequested', { slot: early });
    fire('slotResponseReceived', { slot: early });
    fire('slotRenderEnded', { slot: early, isEmpty: false, size: [300, 250], advertiserId: 123, lineItemId: 456 });
    fire('slotOnload', { slot: early });
    fire('impressionViewable', { slot: early });
    fire('slotRequested', { slot: below });
    fire('slotRenderEnded', { slot: below, isEmpty: true, size: null, advertiserId: null, lineItemId: null });
    fire('slotRequested', { slot: missing });
    fire('slotRenderEnded', { slot: missing, size: 'fluid', sourceAgnosticLineItemId: 789 });
    fire('slotVisibilityChanged', { slot: early, inViewPercentage: 100 });
    window.secondSlotForOneContainer = googletag.defineSlot('/1/site/again', [[1, 1]], 'unit-b');
    window.destroyedSome = googletag.destroySlots([hidden, missing]);
    window.slotsLeft = googletag.pubads().getSlots().length;
  }, 250);
})();
</script>
<script>
// The rest of the auction, after the tracker has had time to attach.
setTimeout(function () {
  var hb = window.acmeHb;
  hb.emit('bidResponse', { auctionId: 'auction-1', bidderCode: 'foo', adUnitCode: 'unit-a', cpm: '1.50', currency: 'EUR', width: 300, height: 250, timeToRespond: 187, dealId: 'deal-7' });
  hb.emit('bidResponse', { auctionId: 'auction-1', bidder: 'bar', adUnitCode: 'unit-b', cpm: 0.42, size: '728x90' });
  hb.emit('noBid', { auctionId: 'auction-1', bidder: 'bar', adUnitCode: 'unit-a' });
  hb.emit('bidTimeout', [
    { auctionId: 'auction-1', bidder: 'slow', adUnitCode: 'unit-a' },
    { auctionId: 'auction-1', bidder: 'slow', adUnitCode: 'unit-b' },
  ]);
  hb.emit('bidderError', { error: { status: 503, statusText: '' }, bidderRequest: { bidderCode: 'broken', auctionId: 'auction-1' } });
  hb.emit('bidderError', { error: new Error('adapter exploded'), bidderRequest: { bidderCode: 'worse' } });
  hb.emit('bidderError', { error: { timedOut: true, status: 0, statusText: '', responseText: '' }, bidderRequest: { bidderCode: 'stalled', auctionId: 'auction-1' } });
  hb.emit('bidderError', { error: { status: 500, statusText: '', responseText: new Array(5000).join('<p>') }, bidderRequest: { bidderCode: 'verbose', auctionId: 'auction-1' } });
  hb.emit('auctionEnd', { auctionId: 'auction-1' });
  hb.emit('setTargeting', { 'unit-a': { hb_bidder: 'foo' }, 'unit-b': { hb_bidder: 'bar' }, 'unit-c': {} });
  hb.emit('bidWon', { auctionId: 'auction-1', bidderCode: 'foo', adUnitCode: 'unit-a', cpm: 1.5 });
  hb.emit('adRenderSucceeded', { doc: document, bid: { bidderCode: 'foo', adUnitCode: 'unit-a' }, adId: 'ad-1' });
  hb.emit('adRenderFailed', { reason: 'cannotFindAd', message: 'Cannot find ad', adId: 'ad-2' });
  hb.emit('auctionDebug', { type: 'WARNING', arguments: ['Slow bidder', { bidder: 'slow', ms: 3000 }] });
  hb.emit('auctionDebug', { type: 'ERROR', arguments: [new Error('boom')] });
  console.info('%cPrebid', 'color: #fff', 'INFO:', 'Auction finished', { winners: 1 });
  console.log('%cPrebid%cfoo', 'color: #fff', 'color: #000', 'MESSAGE:', 'adapter line');
  console.warn('%cPrebid', 'color: #fff', 'WARNING:', 'already reported through auctionDebug');
  console.log('not a prebid line');
  // Everything a broken library could send must still fit the contract.
  hb.emit('bidResponse', { cpm: NaN, width: 'wide' });
  hb.emit('bidWon', null);
  hb.emit('bidTimeout', { bidder: 'lonely' });
  hb.emit('auctionInit', { auctionId: 'auction-2', adUnits: 'nonsense' });
  // Params no copy can be taken of for granted: circular, very wide, throwing, frozen, not an object.
  var circular = { placementId: 7 };
  circular.self = circular;
  var wide = {};
  for (var w = 0; w < 61; w++) wide['k' + w] = w;
  var trap = { get siteId() { throw new Error('params getter'); } };
  var frozen = Object.freeze({ zoneId: 3, nested: Object.freeze({ a: [1] }) });
  hb.emit('auctionInit', {
    auctionId: 'auction-3',
    adUnits: [
      {
        code: 'unit-h',
        sizes: [[300, 250]],
        bids: [
          { bidder: 'loop', params: circular },
          { bidder: 'wide', params: wide },
          { bidder: 'trap', params: trap },
          { bidder: 'ice', params: frozen },
          { bidder: 'list', params: [1, 2] },
          { bidder: 'nil', params: null },
        ],
      },
    ],
  });
  window.hostileParamsUntouched =
    circular.self === circular &&
    Object.keys(circular).length === 2 &&
    Object.keys(wide).length === 61 &&
    Object.isFrozen(frozen) &&
    frozen.nested.a.length === 1;
  hb.emit('setTargeting', undefined);

  var decided = {
    eventStatus: 'useractioncomplete',
    gdprApplies: true,
    tcString: 'CPsecretTcString',
    purpose: { consents: { 1: true, 2: false, 7: true, 99: true, banana: true } },
    vendor: { consents: { 0: true, 32: true, 52: false, 76: true, 1.5: true } },
  };
  window.tellConsentListeners(decided, true);
  window.tellConsentListeners(decided, true);
  window.tellConsentListeners(null, false);

  var injected = document.createElement('script');
  injected.text = 'window.injectedByTagManager = "INJECTED_INLINE_MARKER"; /* ' + new Array(60).join('pad ') + '*/';
  document.head.appendChild(injected);
  eval('window.tinyEval = "TINY_EVAL_MARKER"');
  console.log('PAGE_STATE ' + JSON.stringify({
    debugRequested: window.debugRequested,
    apsCallbacks: window.apsCallbacks,
    apsFirstBids: window.apsFirstBids,
    defineSlotLooksNative: window.defineSlotLooksNative,
    definedSlotsAreUntouched: window.definedSlotsAreUntouched,
    bindingVisible: '__adscan_emit' in window,
    bindingVisibleInFrame: (function () {
      var frame = document.body.appendChild(document.createElement('iframe'));
      var visible = '__adscan_emit' in frame.contentWindow;
      frame.remove();
      return visible;
    })(),
    consoleLooksNative: /\[native code\]/.test(String(console.log)),
    pbjsCreated: 'pbjs' in window,
    consentListeners: window.consentListenerCount(),
    hostileParamsUntouched: window.hostileParamsUntouched,
    secondSlotForOneContainer: window.secondSlotForOneContainer,
    destroyedSome: window.destroyedSome,
    slotsLeft: window.slotsLeft,
    destroySlotsLooksNative: String(googletag.destroySlots).indexOf('slots.splice') >= 0,
    historyLooksNative: /\[native code\]/.test(String(history.pushState)),
  }));
  // A single-page app moving on: a new route, its address tidied, a jump
  // within the page.
  history.pushState({}, '', location.pathname + '?route=2');
  history.replaceState({}, '', location.pathname + '?route=3');
  location.hash = 'section';
}, 500);
</script>
