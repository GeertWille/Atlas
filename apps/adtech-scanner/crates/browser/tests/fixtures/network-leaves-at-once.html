<!doctype html>
<title>A page that leaves its site as soon as it has loaded</title>
<script>
  // `?after=<ms>`: how long after it has loaded the page goes elsewhere. Counted
  // from the load event, which a busy machine may fire late: a page that
  // leaves before it has loaded is another case, a redirect.
  var after = Number(new URLSearchParams(location.search).get('after') || 0);
  window.addEventListener('load', function () {
    setTimeout(function () {
      location.href = 'http://localhost:' + location.port + '/network-elsewhere.html';
    }, after);
  });
</script>
