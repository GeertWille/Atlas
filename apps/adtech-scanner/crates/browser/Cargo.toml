[package]
name = "adscan-browser"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
adscan-model.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures-util = "0.3"
tempfile = "3"
base64 = "0.23"
url = "2"
psl = "2"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
nix = { version = "0.31", features = ["fs", "signal", "user"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "system-proxy"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

[dev-dependencies]
flate2 = "1"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
rustls-pki-types = "1"
tokio-rustls = { version = "0.26", default-features = false }
