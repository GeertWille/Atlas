[workspace]
resolver = "3"
members = ["crates/model", "crates/browser", "crates/engine", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
adscan-model = { path = "crates/model" }
adscan-browser = { path = "crates/browser" }
adscan-engine = { path = "crates/engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
ts-rs = { version = "12", features = ["serde-json-impl"] }
tokio-util = "0.7"
async-trait = "0.1"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
