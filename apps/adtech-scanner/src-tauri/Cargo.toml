[package]
name = "adtech-scanner"
description = "Finds revenue leaks in publishers' ad-tech wrappers"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "adtech_scanner_lib"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
adscan-browser.workspace = true
adscan-engine.workspace = true
adscan-model.workspace = true
async-trait.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-fs = "2.7"
tauri-plugin-opener = "2.7"
tokio.workspace = true
tokio-util.workspace = true

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = ["test"] }
tempfile = "3"
wiremock = "0.6"
# To read a scan's pack back in the real-browser tests.
zstd = "0.14"
